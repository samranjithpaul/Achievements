name: Catalog tool bug
description: Report a problem reading or validating the local catalog
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, Python version, and redacted output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
